name = "shopprofit-fee-intelligence"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cloudflare D1 Database Binding
# For local testing and development, Wrangler uses an internal SQLite database automatically.
# BEFORE remote deployment in future phases, replace the placeholder below with the real D1 Database ID
# obtained from your Cloudflare Dashboard (Workers & Pages > D1 > shopprofit-fees-db)
# or via command: npx wrangler d1 info shopprofit-fees-db
[[d1_databases]]
binding = "DB"
database_name = "shopprofit-fees-db"
database_id = "758e36ac-4d94-45a7-9c0d-d6a18d32780e"

# Scheduled Policy Monitor Cron Trigger (Daily at 08:00 UTC)
[triggers]
crons = ["0 8 * * *"]

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

[vars]
ENABLE_AI_ADVISOR = true
ENABLE_CONVERSATIONAL_PROTOTYPE = true
ALLOW_PUBLIC_WEB_SEARCH_FALLBACK = true

